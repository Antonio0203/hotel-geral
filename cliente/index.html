<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Tavares Correia - Garanhuns</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header / Nav -->
  <header class="navbar">
    <div class="logo">HOTEL TAVARES CORREIA</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#acomodacoes">Acomodações</a>
      <a href="#areas">Nossas Áreas</a>
      <a href="#avaliacoes">Avaliações</a>
      <a href="#reserva" class="btn-reserva-nav">RESERVAR AGORA</a>
    </nav>
  </header>

  <!-- Hero Banner com Filtro Sticky -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>RESERVE SUA ESTADIA</h1>
      <p>Tradição, conforto e a natureza única de Garanhuns.</p>
    </div>

    <!-- Barra de Filtro de Busca -->
    <div class="filter-bar">
      <div class="filter-item">
        <label>Check-in</label>
        <input type="date" id="checkin">
      </div>
      <div class="filter-item">
        <label>Check-out</label>
        <input type="date" id="checkout">
      </div>
      <div class="filter-item">
        <label>Adultos</label>
        <input type="number" id="adultos" value="2" min="1">
      </div>
      <div class="filter-item">
        <label>Crianças</label>
        <input type="number" id="criancas" value="0" min="0">
      </div>
      <button onclick="buscarQuartos()" class="btn-buscar">BUSCAR</button>
    </div>
  </section>

  <!-- Lista de Quartos Disponíveis -->
  <section id="acomodacoes" class="container">
    <h2>Acomodações Disponíveis</h2>
    <div id="grid-quartos" class="grid-quartos">
      <!-- Injetado dinamicamente via JS -->
    </div>
  </section>

  <!-- Seção Nossas Áreas -->
  <section id="areas" class="container bg-light">
    <h2>Nossas Áreas</h2>
    <div class="mosaic-grid">
      <div class="area-card" style="background-image: url('https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=600');"><span>Piscina Aquecida</span></div>
      <div class="area-card" style="background-image: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600');"><span>Fachada Histórica</span></div>
      <div class="area-card" style="background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600');"><span>Restaurante Regional</span></div>
      <div class="area-card" style="background-image: url('https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=600');"><span>Jardins & Bosque</span></div>
    </div>
  </section>

  <!-- Modais Imersivos -->
  <div id="modal-detalhes" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModal('modal-detalhes')">&times;</span>
      <div id="modal-detalhes-body"></div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/modal.js"></script>
</body>
</html>
