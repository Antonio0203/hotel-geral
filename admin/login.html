<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Staff - Hotel Tavares Correia</title>
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #2c3e50;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 380px;
    }
    .login-card h2 {
      margin-bottom: 8px;
      color: #2c3e50;
      text-align: center;
    }
    .login-card p {
      color: #7f8c8d;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #8c6d58;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login:hover {
      background-color: #735744;
    }
    .error-message {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Tavares PMS</h2>
    <p>Painel Restrito para Staff / Administração</p>
    
    <form id="form-login">
      <div class="form-group">
        <label for="email">E-mail Corporativo</label>
        <input type="email" id="email" placeholder="admin@hoteltavares.com.br" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Entrar no Sistema</button>
      <div id="login-error" class="error-message"></div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
